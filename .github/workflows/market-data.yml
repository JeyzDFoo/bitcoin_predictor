name: market-data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 1-5"   # weekdays after US close
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python python/fetch_market.py python/market.csv
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add python/market.csv
          git diff --cached --quiet || (git commit -m "Update market data" && git push)
